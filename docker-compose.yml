services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: retail_analytics
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - retail_postgres_data:/var/lib/postgresql/data

  nl2sql-api:
    build: .
    environment:
      ANALYTICS_DB_TARGET: local
      NL2SQL_PROVIDER: mock
      LOCAL_DATABASE_URL: postgresql://retail:retail@postgres:5432/retail_analytics
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app

  analytics-ui:
    build: .
    environment:
      ENGINE_URL: http://nl2sql-api:8000
    command: ["streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "8501:8501"
    depends_on:
      - nl2sql-api
    volumes:
      - ./:/app

  airflow-init:
    image: apache/airflow:2.10.5
    entrypoint: ["bash", "/opt/airflow/project/docker/airflow-entrypoint.sh"]
    command: ["init"]
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__FERNET_KEY: ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://retail:retail@postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: retail-local-airflow
      LOCAL_DATABASE_URL: postgresql://retail:retail@postgres:5432/retail_analytics
      PYTHONPATH: /opt/airflow/project
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - airflow_logs:/opt/airflow/logs

  airflow-webserver:
    image: apache/airflow:2.10.5
    entrypoint: ["bash", "/opt/airflow/project/docker/airflow-entrypoint.sh"]
    command: ["webserver"]
    environment: *airflow-env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    volumes: *airflow-volumes

  airflow-scheduler:
    image: apache/airflow:2.10.5
    entrypoint: ["bash", "/opt/airflow/project/docker/airflow-entrypoint.sh"]
    command: ["scheduler"]
    environment: *airflow-env
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    volumes: *airflow-volumes

volumes:
  retail_postgres_data:
  airflow_logs:
